name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore Dependencies
      run: dotnet restore MeetupOrganiser.slnx

    - name: Build Solution
      run: dotnet build MeetupOrganiser.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test tests/MeetupOrganiser.Tests/MeetupOrganiser.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
