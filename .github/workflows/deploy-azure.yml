name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Package App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore Dependencies
      run: dotnet restore MeetupOrganiser.slnx

    - name: Build & Test
      run: |
        dotnet build MeetupOrganiser.slnx --configuration Release --no-restore
        dotnet test tests/MeetupOrganiser.Tests/MeetupOrganiser.Tests.csproj --configuration Release --no-build

    - name: Publish Web App
      run: dotnet publish src/MeetupOrganiser.Web/MeetupOrganiser.Web.csproj --configuration Release -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp-publish
        path: ./publish

  deploy-infra:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
      continue-on-error: true

    - name: Deploy Bicep Infrastructure
      run: |
        if [ -n "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters sqlAdministratorLoginPassword="${{ secrets.AZURE_SQL_PASSWORD }}" \
                         entraClientId="${{ vars.AZURE_ENTRA_CLIENT_ID }}" \
                         entraClientSecret="${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}" \
                         smtpClientId="${{ vars.AZURE_SMTP_CLIENT_ID }}" \
                         smtpServicePrincipalId="${{ vars.AZURE_SMTP_SERVICE_PRINCIPAL_ID }}" \
                         smtpClientSecret="${{ secrets.AZURE_SMTP_CLIENT_SECRET }}" \
                         emailCustomDomain="${{ vars.AZURE_EMAIL_CUSTOM_DOMAIN }}" \
                         emailSenderUsername="${{ vars.AZURE_EMAIL_SENDER_USERNAME || 'noreply' }}" \
                         emailCustomDomainVerified="${{ vars.AZURE_EMAIL_CUSTOM_DOMAIN_VERIFIED || 'false' }}"
        else
          echo "AZURE_RESOURCE_GROUP variable not set. Skipping automated infra deployment."
        fi
      continue-on-error: true

  deploy-webapp:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [build, deploy-infra]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp-publish
        path: ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
